version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tinhit_tech_store_postgres
    restart: always
    environment:
      POSTGRES_USER: tinhit_user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: tinhit_tech_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local